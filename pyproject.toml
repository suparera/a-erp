[project]
name = "a-erp"
version = "0.1.0"
description = "A-ERP prototype: synthetic ERP dataset for a Thai hardware & building-materials distributor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "httpx2>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
erp-synth = "erp_synth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_synth", "src/erp_api"]

[tool.vercel]
entrypoint = "src.erp_api.app:app"
